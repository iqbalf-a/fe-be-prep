<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FE/BE Interview Prep — materi persiapan technical test frontend dan backend dengan progress tracker, pencarian global, dan bank pertanyaan interview." />
    <meta name="theme-color" content="#f4f6fb" />
    <title>FE/BE Interview Prep</title>
    <script>
      // Apply the stored theme before React mounts to avoid a flash of the
      // wrong theme. Light is the default; dark only when the user picked it.
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('bsi-theme'));
          document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
